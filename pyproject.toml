[project]
name = "company-brain"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.148.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "openai>=3.35.1",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
